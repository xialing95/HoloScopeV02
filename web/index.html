<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HoloScope V0.2</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="grid-container">
        
        <div id="system-status-bar" class="status-ready">
            <div class="status-content">
                <span id="status-label">SYSTEM:</span>
                <span id="status-message">HoloScope Ready</span>
                
                <span id="camera-tracker" style="margin-left: 20px; font-family: monospace; opacity: 0.9;">
                    [ CAMERA IDLE ]
                </span>
            </div>
            <div id="camera-progress-bar">
                <div id="camera-progress-fill"></div>
            </div>
        </div>

        <div class="card">
            <h3>Live Monitoring (5s Refresh)</h3>
            <div class="preview-box" style="text-align:center; background:#000; min-height:200px;">
                <img id="live-preview" src="" alt="Click Start Preview" style="max-width:100%; height:auto;">
            </div>
            <div class="button-group" style="margin-top:10px;">
                <button id="start-preview-btn" class="btn-blue">Start Preview</button>
                <button id="stop-preview-btn" class="btn-red">Stop Preview</button>
            </div>
        </div>

        <section class="controls">
            <h2>Settings</h2>
            
            <div class="card">
                <h3>Burst Timelapse Setting</h3>
                <label>Project Name: <input type="text" id="proj-name" placeholder="MyProject"></label>
                <label>Photos per Burst: <input type="number" id="burst-count" value="5" min="1"></label>
                <label>Timelapse (Sec): <input type="number" id="time-interval" value="5" min="2"></label>
                <label>Burst Gap (Min): <input type="number" id="burst-gap" value="10" min="1"></label>
                
                <div class="button-group">
                    <button id="burst-btn" class="btn-green">Start Capture</button>
                    <button id="stop-btn" class="btn-red">Stop Capture</button>
                </div>
            </div>
            
        <div class="card">
            <h3>Camera Manual Overrides</h3>
            
            <div class="control-group">
                <label>Shutter Speed (µs): <input type="number" id="shutter" value="2000"></label>
                <label>ISO / Gain: <input type="number" id="iso" value="100" min="100" max="800"></label>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="awb-toggle" checked> Auto White Balance
                </label>
                <div id="manual-wb-controls" style="display:none; margin-top:10px;">
                    <label>Red Gain: <input type="range" id="red-gain" min="0.5" max="4.0" step="0.1" value="1.5"></label>
                    <label>Blue Gain: <input type="range" id="blue-gain" min="0.5" max="4.0" step="0.1" value="1.5"></label>
                </div>
            </div>

            <div class="control-group">
                <label>Contrast: <input type="range" id="contrast" min="0.0" max="2.0" step="0.1" value="1.0"></label>
                <label>Brightness: <input type="range" id="brightness" min="-1.0" max="1.0" step="0.1" value="0.0"></label>
            </div>
            
            <button id="save-settings-btn" class="btn-blue">Apply Camera Settings</button>
        </div>

            <div class="card">
                <h3>Live Sensors</h3>
                <div class="sensor-grid">
                    <div class="sensor-item">
                        <span class="label">Temp</span>
                        <span id="temp-val" class="value">--°C</span>
                    </div>
                    <div class="sensor-item">
                        <span class="label">Humidity</span>
                        <span id="hum-val" class="value">--%</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Environmental Logging Config</h3>
                <label>Log Interval (Sec): <input type="number" id="log-interval" value="60"></label>
                <label class="checkbox-label">
                    <input type="checkbox" id="log-enabled"> Enable Data Logging (.csv)
                </label>
                <button id="save-log-btn" class="btn-blue">Update Logging</button>
            </div>

        <div class="card">
            <h3>Files & Storage</h3>
            <div class="gallery-controls" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="refresh-btn" class="btn-blue">Refresh</button>
                <button id="delete-all-btn" class="btn-red">Delete All</button>
            </div>
            <div id="file-list" class="file-container">
                <p class="empty-msg">No images captured yet.</p>
            </div>
        </div>

        <div class="card system">
            <h3>System & Network</h3>
            <label>SSID: <input type="text" id="wifi-ssid"></label>
            <label>Password: <input type="password" id="wifi-pass"></label>
            <button id="wifi-btn">Connect WiFi</button>
            <button id="hotspot-btn" class="btn-warn">Enable Hotspot</button>
        </div>

        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
