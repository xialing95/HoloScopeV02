        <div class="card">
            <h3>HoloScope Control</h3>
            
            <div class="mode-selector" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="start-preview-btn" class="btn-blue" style="flex: 1;">Start Preview</button>
                <button id="stop-btn" class="btn-red" style="flex: 1;">Emergency Stop</button>
            </div>

            <hr>

            <div class="settings-group">
                <h4>Camera Tuning</h4>
                <label>Shutter (µs): <input type="number" id="shutter" value="2000"></label>
                <label>ISO: <input type="number" id="iso" value="100"></label>
                
                <label>
                    <input type="checkbox" id="awb-toggle" checked> Auto White Balance
                </label>
                
                <div id="manual-wb-controls" style="display:none; padding-left: 15px; border-left: 2px solid #ccc;">
                    <label>Red Gain: <input type="number" id="red-gain" value="1.5" step="0.1"></label>
                    <label>Blue Gain: <input type="number" id="blue-gain" value="1.5" step="0.1"></label>
                </div>
                
                <button id="save-settings-btn" class="btn-small">Apply Tuning</button>
            </div>

            <hr>

            <div class="settings-group">
                <h4>Experiment (Burst Mode)</h4>
                <label>Project: <input type="text" id="proj-name" value="Exp_01"></label>
                <label>Burst Count: <input type="number" id="burst-count" value="5"></label>
                <button id="start-burst-btn" class="btn-green">🚀 Start Burst Sequence</button>
            </div>
        </div>

        <div class="card">
            <img id="preview-frame" src="" style="width: 100%; border-radius: 8px; background: #000;" alt="Camera Feed">
            <p id="status-text" style="text-align: center; color: #666;">Status: Idle</p>
        </div>

            <div class="card">
                <h3>Live Sensors</h3>
                <div class="sensor-grid">
                    <div class="sensor-item">
                        <span class="label">Temp</span>
                        <span id="temp-val" class="value">--°C</span>
                    </div>
                    <div class="sensor-item">
                        <span class="label">Humidity</span>
                        <span id="hum-val" class="value">--%</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Environmental Logging Config</h3>
                <label>Log Interval (Sec): <input type="number" id="log-interval" value="60"></label>
                <label class="checkbox-label">
                    <input type="checkbox" id="log-enabled"> Enable Data Logging (.csv)
                </label>
                <button id="save-log-btn" class="btn-blue">Update Logging</button>
            </div>

            <div class="card">
                <h3>Gallery & Storage</h3>
                <div class="gallery-controls">
                    <button id="refresh-btn" class="btn-blue">Refresh Data Folder</button>
                </div>
                <div id="file-list" class="file-container">
                    <p class="empty-msg">No images captured yet.</p>
                </div>
            </div>

            <div class="card system">
                <h3>System & Network</h3>
                <label>SSID: <input type="text" id="wifi-ssid"></label>
                <label>Password: <input type="password" id="wifi-pass"></label>
                <button onclick="updateNetwork('wifi')">Connect WiFi</button>
                <button onclick="updateNetwork('hotspot')" class="btn-warn">Enable Hotspot</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
